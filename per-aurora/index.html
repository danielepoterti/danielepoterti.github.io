<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Per Aurora</title>
<meta property="og:title" content="Per te, Aurora">
<meta property="og:description" content="Un mazzo di rose, scritto in codice.">
<style>
  :root {
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Roboto Mono", "DejaVu Sans Mono", "Liberation Mono", monospace;
    --fg: #c9d1d9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: var(--fg); overflow: hidden; overscroll-behavior: none; }
  body { font-family: var(--mono); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; touch-action: manipulation; }
  #grid { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #glow { position: absolute; left: 0; top: 0; pointer-events: none; mix-blend-mode: screen; opacity: .55; filter: blur(5px) saturate(1.3); }
  #note { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; line-height: 1.7; white-space: pre; pointer-events: none; }
  #note .l0 { color: #f4f4f5; text-shadow: 0 0 10px rgba(244,244,245,.55); }
  #note .l1 { color: #f2c94c; text-shadow: 0 0 10px rgba(242,201,76,.55); }
  #note .heart { color: #ff4d6d; text-shadow: 0 0 10px rgba(255,77,109,.8); }
  #note .rest { visibility: hidden; }
  #again {
    position: absolute; left: 50%; transform: translateX(-50%); padding: 12px 14px;
    font-family: var(--mono); font-weight: 700; letter-spacing: .35em; white-space: pre;
    color: #ff8fa3; text-shadow: 0 0 10px rgba(255,77,109,.7);
    background: none; border: 0; cursor: pointer; -webkit-appearance: none; appearance: none;
    opacity: 0; transition: opacity 1.2s, color .2s; pointer-events: none;
  }
  #again.show { opacity: 1; pointer-events: auto; }
  #again:hover, #again:active { color: #fff; }
</style>
</head>
<body>
<div id="app">
  <section id="stage">
    <canvas id="grid" role="img" aria-label="Un mazzo di rose fatto di lettere che sboccia, con un biglietto: per te, Aurora. Buona laurea, dottoressa."></canvas>
    <canvas id="glow"></canvas>
    <div id="note" aria-hidden="true"></div>
    <button id="again" type="button">[ RIVEDI ]</button>
  </section>
</div>
<script>
'use strict';
// un mazzo di rose fatto di lettere.
// a ogni fotogramma il mazzo viene costruito come una nuvola di punti in 3D,
// girato verso di te e schiacciato su una griglia di caratteri: in ogni casella
// resta il punto più vicino, la luce sceglie la lettera, il materiale il colore.

const TAU = Math.PI * 2;
const MONO = getComputedStyle(document.body).fontFamily;
const GOLDEN = Math.PI * (3 - Math.sqrt(5));

// ── quando succede cosa (secondi) ──────────────────────────────────────
const T_STEM = 0.4;              // gli steli salgono dal fondo
const T_DOME = [2.0, 3.8];       // la cupola di foglie sotto i fiori
const T_PAPER = [3.0, 4.9];      // la carta si avvolge, partendo da dietro
const T_RIBBON = [4.4, 6.0];     // il nastro si stringe in vita
const T_OPEN = 5.8;              // la prima rosa si apre...
const OPEN_GAP = 0.34;           // ...poi le altre, una alla volta
const OPEN_DUR = 1.6;
const T_MSG = 13.6;              // il biglietto
const T_FALL = 14.6;             // e qualche petalo comincia a cadere
const T_END = 18.5;

// ── la forma del mazzo ─────────────────────────────────────────────────
const N_ROSES = 19;
const WAIST_Y = -0.40;           // dove il nastro stringe gli steli
const FOOT_Y = -1.02;            // il fondo degli steli
const DOME_C = [0, 0.45, 0];     // la cupola dei fiori
const DOME_R = [0.86, 0.5, 0.84];
const DOME_TILT = 1.05;          // inclinata verso di te
const BAND_R = 0.105;            // il raggio del nastro

// i materiali: ognuno ha la sua scala di colori, dallo scuro al chiaro
const STEM = 0, LEAF = 1, ROSE = 2, PAPER = 3, RIBBON = 4, SPARK = 5, STAR = 6, WINE = 7, BLUSH = 8, LEVELS = 16;

const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const ramp = (t, a, b) => smooth((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const angDist = (a, b) => { const d = (((a - b) % TAU) + TAU) % TAU; return d > Math.PI ? TAU - d : d; };

function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = rng(20261117);

function unit(x, y, z) { const l = Math.sqrt(x * x + y * y + z * z) || 1; return [x / l, y / l, z / l]; }
function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }

// un punto sulla cupola: r da 0 (in cima) a 1 (sul bordo), a = l'angolo attorno
function domePoint(r, a, lift, o) {
  const x = DOME_R[0] * r * Math.cos(a);
  const z = DOME_R[2] * r * Math.sin(a);
  const y = DOME_R[1] * Math.sqrt(Math.max(0, 1 - 0.92 * r * r)) + lift;
  const c = Math.cos(DOME_TILT), s = Math.sin(DOME_TILT);
  o[0] = DOME_C[0] + x;
  o[1] = DOME_C[1] + y * c - z * s;
  o[2] = DOME_C[2] + y * s + z * c;
  return o;
}

// ── diciannove rose: dove stanno, dove guardano, quando si aprono ─────
const ROSES = [];
{
  const order = Array.from({ length: N_ROSES }, (_, i) => i);   // in che ordine si aprono
  for (let i = N_ROSES - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  for (let i = 0; i < N_ROSES; i++) {
    const r = 0.98 * Math.sqrt((i + 0.5) / N_ROSES);
    const a = i * GOLDEN + 0.6;
    const p = domePoint(r, a, 0.07, [0, 0, 0]);
    const A = unit(p[0], p[1] - 0.1, p[2] + 0.6);            // l'asse del fiore: guarda fuori
    const e1 = unit(...cross(A, Math.abs(A[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0]));
    const e2 = cross(A, e1);
    const size = 0.18 + 0.04 * rand();
    const tone = rand();
    const stemAt = T_STEM + 0.3 * rand();
    ROSES.push({
      p, A, e1, e2, size,
      mat: tone < 0.3 ? WINE : tone < 0.75 ? ROSE : BLUSH,   // non tutte dello stesso rosso
      turn: rand() * TAU,
      stemAt,
      budAt: stemAt + 1.55,
      openAt: T_OPEN + order[i] * OPEN_GAP,
      foot: [0.06 * r * Math.cos(a) + 0.015 * (rand() - 0.5), FOOT_Y + 0.05 * rand(), 0.05 * r * Math.sin(a)],
      waist: [0.05 * r * Math.cos(a), WAIST_Y, 0.04 * r * Math.sin(a)],
      base: [p[0] - A[0] * 0.35 * size, p[1] - A[1] * 0.35 * size, p[2] - A[2] * 0.35 * size],
    });
  }
}

// ── la griglia: profondità, lettera e colore per ogni casella ─────────
const RAMP = '.:-=+*cxoa%#&8B$@';
const GLYPHS = RAMP + '-/|\\';
const RAMP_N = RAMP.length, DIR0 = RAMP_N, EMPTY = 255;
const G_DOT = RAMP.indexOf('.'), G_PLUS = RAMP.indexOf('+'), G_STAR = RAMP.indexOf('*');
const MATERIALS = [
  ['#0e3a17', '#2f9e44', '#9be9a8'],   // steli
  ['#0a3013', '#23863a', '#74d680'],   // foglie
  ['#24020a', '#c8102e', '#ffb3c1'],   // rose
  ['#26262c', '#7d7d88', '#e8e4da'],   // carta
  ['#4f3504', '#d4a017', '#fff0b8'],   // nastro
  ['#6b3d00', '#ffd166', '#fff7d6'],   // scintille
  ['#1c2029', '#5f6776', '#eef1f6'],   // stelle
  ['#1a0207', '#990a26', '#f08099'],   // rose più scure
  ['#33060f', '#e3264a', '#ffc9d4'],   // rose più chiare
];
const PALETTE = [], PALETTE_RGB = [];
for (const [lo, mid, hi] of MATERIALS) {
  const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [a, b, c] = [rgb(lo), rgb(mid), rgb(hi)];
  for (let l = 0; l < LEVELS; l++) {
    const k = (l + 0.5) / LEVELS;
    const m = k < 0.5 ? a.map((x, i) => lerp(x, b[i], k * 2)) : b.map((x, i) => lerp(x, c[i], k * 2 - 1));
    PALETTE.push(`rgb(${m.map(Math.round).join(',')})`);
    PALETTE_RGB.push(m.map(Math.round));
  }
}

let cols = 0, rows = 0, cellW = 4, cellH = 7, S = 100, OX = 0, OY = 0;
let zbuf = new Float32Array(0), gbuf = new Uint8Array(0), cbuf = new Uint8Array(0);
let cY = 1, sY = 0, cP = 1, sP = 0, hit = 0, hitZ = 0;
const CAM = 7;
const [LX, LY, LZ] = unit(-0.55, 0.65, 0.5);    // la luce, in alto a sinistra

// gira il punto verso la camera, proiettalo, e tienilo solo se è il più vicino
function project(x, y, z) {
  const x1 = x * cY + z * sY, z1 = z * cY - x * sY;
  const y2 = y * cP - z1 * sP, z2 = y * sP + z1 * cP;
  const k = (CAM / (CAM - z2)) * S;
  const c = (OX + x1 * k) / cellW, r = (OY - y2 * k) / cellH;
  if (c < 0 || r < 0 || c >= cols || r >= rows) return false;
  const i = (r | 0) * cols + (c | 0);
  if (z2 <= zbuf[i]) return false;
  zbuf[i] = z2; hit = i; hitZ = z2;
  return true;
}

const GLYPH_OF = Array.from({ length: 64 }, (_, i) => Math.round(Math.sqrt(i / 63) * (RAMP_N - 1)));

function put(i, mat, lum, glyph) {
  lum = clamp01(lum);
  gbuf[i] = glyph >= 0 ? glyph : GLYPH_OF[(lum * 63) | 0];
  cbuf[i] = mat * LEVELS + Math.min(LEVELS - 1, (lum * LEVELS) | 0);
}

const depth = () => 0.68 + 0.32 * clamp01((hitZ + 1.3) / 2.6);

// la luce sceglie la lettera; se c'è una direzione (un bordo), la lettera la segue
function emit(x, y, z, nx, ny, nz, mat, shade, tx, ty, tz) {
  if (!project(x, y, z)) return;
  const m1 = nz * cY - nx * sY;
  let mx = nx * cY + nz * sY, my = ny * cP - m1 * sP, mz = ny * sP + m1 * cP;
  if (mz < 0) { mx = -mx; my = -my; }            // superfici sottili: luce su tutte e due le facce
  const d = mx * LX + my * LY + Math.abs(mz) * LZ;
  const rim = 0.5 + 0.5 * Math.abs(mz);           // di taglio: più scuro, così i contorni si staccano
  const l = (0.2 + 0.8 * (d > 0 ? d : 0)) * rim * shade * depth();
  const lum = l * (1.3 - 0.3 * l);                 // schiarisce i mezzitoni
  put(hit, mat, lum, tx === undefined ? -1 : lineGlyph(tx, ty, tz));
}

// una linea vista sullo schermo diventa uno di: - / | \
function lineGlyph(tx, ty, tz) {
  const tz1 = tz * cY - tx * sY;
  let a = Math.atan2(ty * cP - tz1 * sP, tx * cY + tz * sY);
  if (a < 0) a += Math.PI;
  return DIR0 + (Math.round(a / (Math.PI / 4)) % 4);
}

function emitLine(x, y, z, tx, ty, tz, mat, lum) {
  if (project(x, y, z)) put(hit, mat, lum * depth(), lineGlyph(tx, ty, tz));
}

function emitGlyph(x, y, z, glyph, mat, lum) {
  if (project(x, y, z)) put(hit, mat, lum, glyph);
}

// una superficie f(u, v): prima tutti i punti della griglia, poi le normali
// dai punti vicini; con edges, i bordi (da lì in su) diventano tratti di penna;
// con ball, la luce gira attorno a un centro, come su una palla: ogni fiore
// prende il suo chiaro e il suo scuro
const P0 = new Float64Array(4), G = new Float64Array(4 * 4096);
function surface(f, nu, nv, mat, edges, ball) {
  for (let i = 0, o = 0; i < nu; i++) {
    for (let j = 0; j < nv; j++, o += 4) {
      P0[3] = 1;
      f(i / (nu - 1), -1 + (2 * j) / (nv - 1), P0);
      G[o] = P0[0]; G[o + 1] = P0[1]; G[o + 2] = P0[2]; G[o + 3] = P0[3];
    }
  }
  for (let i = 0; i < nu; i++) {
    const i0 = (i > 0 ? i - 1 : i) * nv, i1 = (i < nu - 1 ? i + 1 : i) * nv;
    for (let j = 0; j < nv; j++) {
      const j0 = j > 0 ? j - 1 : j, j1 = j < nv - 1 ? j + 1 : j, o = (i * nv + j) * 4;
      const a = (i1 + j) * 4, b = (i0 + j) * 4, c = (i * nv + j1) * 4, d = (i * nv + j0) * 4;
      const ax = G[a] - G[b], ay = G[a + 1] - G[b + 1], az = G[a + 2] - G[b + 2];
      const bx = G[c] - G[d], by = G[c + 1] - G[d + 1], bz = G[c + 2] - G[d + 2];
      let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
      const l = Math.sqrt(nx * nx + ny * ny + nz * nz);
      if (l < 1e-12) { nx = 0; ny = 1; nz = 0; } else { nx /= l; ny /= l; nz /= l; }
      if (ball) {
        let qx = G[o] - ball[0], qy = G[o + 1] - ball[1], qz = G[o + 2] - ball[2];
        const q = Math.sqrt(qx * qx + qy * qy + qz * qz) || 1;
        const sgn = nx * qx + ny * qy + nz * qz < 0 ? -0.25 : 0.25;
        qx = nx * sgn + (qx / q) * 0.75; qy = ny * sgn + (qy / q) * 0.75; qz = nz * sgn + (qz / q) * 0.75;
        const m = Math.sqrt(qx * qx + qy * qy + qz * qz) || 1;
        nx = qx / m; ny = qy / m; nz = qz / m;
      }
      if (edges && i === nu - 1) {
        emit(G[o], G[o + 1], G[o + 2], nx, ny, nz, mat, G[o + 3] * 0.7, bx, by, bz);
      } else if (edges && i >= edges * (nu - 1) && (j === 0 || j === nv - 1)) {
        emit(G[o], G[o + 1], G[o + 2], nx, ny, nz, mat, G[o + 3] * 0.7, ax, ay, az);
      } else {
        emit(G[o], G[o + 1], G[o + 2], nx, ny, nz, mat, G[o + 3]);
      }
    }
  }
}

// ── gli steli ──────────────────────────────────────────────────────────
// dal fondo salgono dritti fino al nastro, poi si aprono a ventaglio
// e curvano ognuno verso la sua rosa
function stemPoint(R, s, o) {
  const w = R.waist;
  if (s < 0.38) {
    const k = s / 0.38, f = R.foot;
    o[0] = lerp(f[0], w[0], k); o[1] = lerp(f[1], w[1], k); o[2] = lerp(f[2], w[2], k);
    return;
  }
  const k = (s - 0.38) / 0.62, b = R.base, j = 1 - k;
  const c0 = w[0] + 0.15 * (b[0] - w[0]), c1 = w[1] + 0.45, c2 = w[2] + 0.15 * (b[2] - w[2]);
  o[0] = j * j * w[0] + 2 * j * k * c0 + k * k * b[0];
  o[1] = j * j * w[1] + 2 * j * k * c1 + k * k * b[1];
  o[2] = j * j * w[2] + 2 * j * k * c2 + k * k * b[2];
}

function stems(t) {
  const p = [0, 0, 0], q = [0, 0, 0];
  for (const R of ROSES) {
    const grow = ramp(t, R.stemAt, R.stemAt + 1.9);
    if (grow <= 0) continue;
    for (let i = 0; i <= 30; i++) {
      const s = (i / 30) * grow;
      stemPoint(R, s, p); stemPoint(R, Math.min(1, s + 0.01), q);
      const tx = q[0] - p[0], ty = q[1] - p[1], tz = q[2] - p[2];
      const bl = Math.sqrt(tx * tx + ty * ty) || 1, ax = ty / bl, ay = -tx / bl;   // di lato al gambo...
      const tl = Math.sqrt(tx * tx + ty * ty + tz * tz) || 1;
      const bx = (-tz * ay) / tl, by = (tz * ax) / tl, bz = (tx * ay - ty * ax) / tl;  // ...e davanti
      const rad = 0.019 - 0.005 * s;
      for (let k = 0; k < 3; k++) {
        const c = Math.cos((k * TAU) / 3), sn = Math.sin((k * TAU) / 3);
        const nx = ax * c + bx * sn, ny = ay * c + by * sn, nz = bz * sn;
        emit(p[0] + nx * rad, p[1] + ny * rad, p[2] + nz * rad, nx, ny, nz, STEM, 0.9);
      }
    }
  }
}

// ── le foglie ──────────────────────────────────────────────────────────
// una cupola verde fitta appena sotto i fiori, così tra una rosa e l'altra
// si vede solo foglia; e qualche foglia lunga che sporge dal bordo
const LEAVES = Array.from({ length: 24 }, (_, j) => {
  const a = j * GOLDEN * 2.1 + 0.3, r = 0.72 + 0.3 * rand();
  const base = domePoint(r, a, -0.02, [0, 0, 0]);
  const dir = unit(base[0] * 1.2, base[1] - 0.15 - 0.25 * rand(), (base[2] + 0.04) * 1.2);
  const side = unit(...cross(dir, [0, 1, 0]));
  return { base, dir, side, nrm: cross(side, dir), len: 0.26 + 0.1 * rand(), at: T_DOME[0] + 0.5 + 0.05 * j };
});

function foliage(t) {
  const g = ramp(t, T_DOME[0], T_DOME[1]);
  if (g > 0) surface((u, v, o) => { domePoint(u * g, v * Math.PI, 0, o); o[3] = 0.5 + 0.4 * u; }, 18, 64, LEAF);
  for (const L of LEAVES) {
    const s = ramp(t, L.at, L.at + 0.8);
    if (s <= 0) continue;
    const { base: B, dir: D, side: E, nrm: N } = L, len = L.len * s;
    surface((u, v, o) => {
      const w = 0.085 * s * Math.pow(Math.sin(Math.PI * u), 0.8) * (1 - 0.25 * u);
      const lift = 0.3 * Math.abs(v) * w - 0.14 * u * u * len;   // nervatura a V, punta che piega
      o[0] = B[0] + D[0] * u * len + E[0] * v * w + N[0] * lift;
      o[1] = B[1] + D[1] * u * len + E[1] * v * w + N[1] * lift;
      o[2] = B[2] + D[2] * u * len + E[2] * v * w + N[2] * lift;
      o[3] = 0.65 + 0.35 * u;
    }, 9, 5, LEAF, 0.25);
  }
}

// ── la carta ───────────────────────────────────────────────────────────
// un cono che parte dalla vita e si apre verso l'alto: alto dietro,
// basso davanti; solo le pieghe e il bordo, così i fiori traspaiono
function paperPoint(phi, f, o) {
  const H = lerp(0.25, 1.6, (1 - Math.sin(phi)) / 2) + 0.05 * Math.sin(5 * phi);
  const h = f * H;
  const r = (0.09 + 0.5 * Math.min(h, 0.12) + 1.08 * (1 - Math.exp(-Math.max(0, h - 0.12) * 3.4)))
    * (1 + 0.035 * Math.sin(13 * phi) * f);
  o[0] = r * Math.cos(phi); o[1] = WAIST_Y - 0.03 + h; o[2] = r * Math.sin(phi);
}

function paper(t) {
  const w = ramp(t, T_PAPER[0], T_PAPER[1]);
  if (w <= 0) return;
  const reach = Math.PI * w, p = [0, 0, 0], q = [0, 0, 0];
  for (const f of [0.45, 0.75, 1]) {                    // il bordo, e due segni di piega
    if (f > w * 1.3) break;
    for (let k = 0; k < 200; k++) {
      const phi = -Math.PI + (TAU * k) / 200;
      if (angDist(phi, -Math.PI / 2) > reach) continue;
      paperPoint(phi, f, p); paperPoint(phi + 0.01, f, q);
      emitLine(p[0], p[1], p[2], q[0] - p[0], q[1] - p[1], q[2] - p[2], PAPER, f === 1 ? 0.62 : 0.32);
    }
  }
  for (let k = 0; k < 52; k++) {                        // le pieghe
    const phi = -Math.PI + (TAU * k) / 52;
    if (angDist(phi, -Math.PI / 2) > reach) continue;
    for (let j = 0; j <= 28; j++) {
      const f = (j / 28) * Math.min(1, w * 1.3);
      paperPoint(phi, f, p); paperPoint(phi, f + 0.01, q);
      emitLine(p[0], p[1], p[2], q[0] - p[0], q[1] - p[1], q[2] - p[2], PAPER, 0.3 + 0.22 * f);
    }
  }
}

// ── il nastro ──────────────────────────────────────────────────────────
// una fascia attorno alla vita, poi il nodo, due asole e due code
function ribbon(t) {
  const wrap = ramp(t, T_RIBBON[0], T_RIBBON[0] + 0.7);
  if (wrap <= 0) return;
  const bow = ramp(t, T_RIBBON[0] + 0.5, T_RIBBON[1]);
  surface((u, v, o) => {
    const phi = Math.PI / 2 + v * Math.PI * wrap;
    o[0] = BAND_R * Math.cos(phi); o[1] = WAIST_Y + (u - 0.5) * 0.09; o[2] = BAND_R * Math.sin(phi);
  }, 5, 48, RIBBON);
  if (bow <= 0) return;
  const z0 = 0.17;
  surface((u, v, o) => {                                 // il nodo
    const a = u * Math.PI, b = v * Math.PI;
    o[0] = 0.035 * bow * Math.sin(a) * Math.cos(b);
    o[1] = WAIST_Y + 0.03 * bow * Math.cos(a);
    o[2] = z0 + 0.02 + 0.025 * Math.sin(a) * Math.sin(b);
  }, 8, 14, RIBBON);
  for (const k of [-1, 1]) {
    surface((u, v, o) => {                               // le asole
      const a = v * Math.PI, rx = 0.11 * bow * u * Math.cos(a), ry = 0.07 * bow * u * Math.sin(a);
      const c = Math.cos(0.35 * k), s = Math.sin(0.35 * k);
      o[0] = k * 0.125 * bow + rx * c - ry * s;
      o[1] = WAIST_Y + 0.025 + rx * s + ry * c;
      o[2] = z0 + 0.04 * (1 - u * u);
      o[3] = 0.75 + 0.25 * u;
    }, 8, 20, RIBBON);
    surface((u, v, o) => {                               // le code
      const w = 0.022 * (1 - 0.25 * u);
      o[0] = k * (0.015 + 0.08 * u) + 0.01 * Math.sin(5 * u + t * 1.7 + k) + v * w * 0.95;
      o[1] = WAIST_Y - 0.02 - 0.2 * u * bow + v * w * 0.3 * k;
      o[2] = z0 + 0.03 * u;
    }, 10, 4, RIBBON);
  }
}

// ── i petali ───────────────────────────────────────────────────────────
// tre giri di petali a spirale: chiusi a bocciolo, poi si piegano in fuori;
// quelli esterni si aprono di più e si arricciano sulla punta
const PETAL_LAYERS = [
  { n: 3, len: 0.62, wide: 2.4, shut: 0.1, open: 0.45, flare: 0.1, r0: 0.02, shade: 0.6, nu: 5, nv: 4 },
  { n: 5, len: 0.86, wide: 1.55, shut: 0.2, open: 0.88, flare: 0.26, r0: 0.08, shade: 0.85, nu: 7, nv: 5 },
  { n: 5, len: 1.0, wide: 1.45, shut: 0.32, open: 1.18, flare: 0.42, r0: 0.14, shade: 1, nu: 8, nv: 6 },
];

function petals(t) {
  for (const R of ROSES) {
    const bud = ramp(t, R.budAt, R.budAt + 0.7);
    if (bud <= 0) continue;
    const open = ramp(t, R.openAt, R.openAt + OPEN_DUR);
    const size = R.size * (0.5 + 0.5 * bud) * (0.72 + 0.28 * open);
    const [px, py, pz] = R.p, [ax, ay, az] = R.A, [ex, ey, ez] = R.e1, [fx, fy, fz] = R.e2;
    const heart = [px - ax * size * 0.3, py - ay * size * 0.3, pz - az * size * 0.3];
    PETAL_LAYERS.forEach((L, l) => {
      const len = L.len * size, tilt = lerp(L.shut, L.open, open), flare = L.flare * open;
      const st = Math.sin(tilt), ct = Math.cos(tilt);
      for (let k = 0; k < L.n; k++) {
        const ang = R.turn + l * 0.9 + (k * TAU) / L.n;
        surface((u, v, o) => {
          const half = 0.5 * L.wide * (0.45 + 0.55 * Math.sin(Math.PI * (0.15 + 0.7 * u)));
          const phi = ang + v * half;
          const rho = (L.r0 * size + len * (u * st + flare * u * u))
            * (1 + 0.12 * open * v * v) * (1 - (1 - open) * 0.45 * u * u);
          const h = len * (u * ct - 0.35 * flare * u * u) - 0.35 * size;
          const c = Math.cos(phi), s = Math.sin(phi);
          o[0] = px + ax * h + (ex * c + fx * s) * rho;
          o[1] = py + ay * h + (ey * c + fy * s) * rho;
          o[2] = pz + az * h + (ez * c + fz * s) * rho;
          o[3] = (0.7 + 0.3 * u) * L.shade;                         // più scuro verso il cuore
        }, L.nu, L.nv, R.mat, l === 2 ? 1 : 0, heart);
      }
    });
  }
}

// ── i sepali ───────────────────────────────────────────────────────────
// cinque foglioline strette sotto il fiore: abbracciano il bocciolo,
// poi si piegano all'indietro mentre la rosa si apre
function sepals(t) {
  for (const R of ROSES) {
    const bud = ramp(t, R.budAt, R.budAt + 0.7);
    if (bud <= 0) continue;
    const open = ramp(t, R.openAt, R.openAt + OPEN_DUR);
    const beta = lerp(0.5, 1.9, open), len = R.size * 0.75 * bud;
    const B = R.base, A = R.A;
    for (let k = 0; k < 5; k++) {
      const g = R.turn + 0.3 + (k * TAU) / 5;
      const rad = [0, 1, 2].map((i) => R.e1[i] * Math.cos(g) + R.e2[i] * Math.sin(g));
      const D = [0, 1, 2].map((i) => -A[i] * Math.cos(beta) + rad[i] * Math.sin(beta));
      const E = unit(...cross(D, rad));
      surface((u, v, o) => {
        const w = 0.022 * Math.sin(Math.PI * Math.min(1, u * 1.15 + 0.05));
        for (let i = 0; i < 3; i++) o[i] = B[i] + D[i] * u * len + E[i] * v * w - A[i] * 0.25 * u * u * len * open;
      }, 5, 3, LEAF);
    }
  }
}

// ── le scintille ───────────────────────────────────────────────────────
// quando una rosa finisce di aprirsi, lancia una manciata di scintille
const POP = ROSES.map(() => Array.from({ length: 16 }, () => {
  const d = unit(rand() - 0.5, rand() - 0.3, rand() - 0.5);
  return [d[0], d[1], d[2], 0.45 + 0.5 * rand()];
}));

function pop(t) {
  ROSES.forEach((R, i) => {
    const age = t - (R.openAt + OPEN_DUR * 0.8);
    if (age < 0 || age > 1.4) return;
    for (const [dx, dy, dz, sp] of POP[i]) {
      const go = sp * age * (1 - 0.3 * age);
      const g = age < 0.35 ? G_STAR : age < 0.8 ? G_PLUS : G_DOT;
      emitGlyph(R.p[0] + dx * go, R.p[1] + dy * go - 0.3 * age * age, R.p[2] + dz * go, g, SPARK, 1 - age / 1.5);
    }
  });
}

// ── il cielo ───────────────────────────────────────────────────────────
// stelle che brillano piano sullo sfondo, e qualche stella più grande
// che si accende a croce e si spegne
const STARS = Array.from({ length: 320 }, () => [rand(), rand(), 0.6 + 2.2 * rand(), rand() * TAU]);
const N_FLARES = 7;

function stars(t) {
  for (const [fx, fy, sp, ph] of STARS) {
    const i = ((fy * rows) | 0) * cols + ((fx * cols) | 0);
    if (gbuf[i] !== EMPTY) continue;
    const tw = Math.pow(0.5 + 0.5 * Math.sin(t * sp + ph), 4);
    put(i, STAR, 0.18 + 0.6 * tw, tw > 0.85 ? G_PLUS : G_DOT);
  }
  for (let k = 0; k < N_FLARES; k++) {
    const period = 4.2 + k * 0.7, x = (t + k * 1.9) / period, cyc = Math.floor(x);
    const glow = Math.pow(Math.sin(Math.PI * (x - cyc)), 2);
    const h = rng(k * 7919 + cyc * 104729);
    const c0 = (h() * cols) | 0, r0 = (h() * rows) | 0;
    const arm = Math.round(glow * 6), up = Math.round(glow * 3);
    const dot = (c, r, g, lum) => {
      if (c < 0 || r < 0 || c >= cols || r >= rows) return;
      const i = r * cols + c;
      if (zbuf[i] === -Infinity) put(i, STAR, lum, g);
    };
    if (glow < 0.08) continue;
    dot(c0, r0, G_STAR, glow);
    for (let d = 1; d <= arm; d++) { const l = glow * (1 - d / (arm + 1)); dot(c0 - d, r0, DIR0, l); dot(c0 + d, r0, DIR0, l); }
    for (let d = 1; d <= up; d++) { const l = glow * (1 - d / (up + 1)); dot(c0, r0 - d, DIR0 + 2, l); dot(c0, r0 + d, DIR0 + 2, l); }
  }
}

// ── il biglietto ───────────────────────────────────────────────────────
// scritto sotto il mazzo, una decina di lettere al secondo;
// più grande della griglia, quindi è testo vero, appoggiato sopra
const MESSAGE = ['per te, aurora <3', 'buona laurea, dottoressa'];
const TYPE_SPEED = 11, LINE_PAUSE = 0.6, BREAK_PAUSE = 0.25;
const NOTE_LINE_H = 1.7, NOTE_MIN = 18, NOTE_MAX = 26;
const note = document.getElementById('note');
let LAYOUT = [], NOTE_LINES = [], typedShown = '';

// spezza una riga in due, alla virgola (o allo spazio) più vicina al centro
function halves(text) {
  let best = -1;
  for (const mark of [', ', ' ']) {
    for (let k = text.indexOf(mark); k > 0; k = text.indexOf(mark, k + 1)) {
      if (best < 0 || Math.abs(k - text.length / 2) < Math.abs(best - text.length / 2)) best = k;
    }
    if (best > 0) return [text.slice(0, best + mark.trimEnd().length), text.slice(best + mark.length)];
  }
  return [text];
}

// le righe sullo schermo: [testo, da quale riga del biglietto viene]
function layoutNote(W, ratio) {
  const fit = (n) => (W * 0.86) / (n * ratio * 1.5);
  let lines = MESSAGE.map((text, li) => [text, li]);
  for (let tries = 0; tries < 3; tries++) {
    const longest = lines.reduce((a, b) => (b[0].length > a[0].length ? b : a));
    if (fit(longest[0].length) >= NOTE_MIN) break;
    lines = lines.flatMap((l) => (l === longest ? halves(l[0]).map((h) => [h, l[1]]) : [l]));
  }
  LAYOUT = lines;
  note.textContent = '';
  NOTE_LINES = LAYOUT.map(([, li]) => {
    const el = document.createElement('div');
    el.className = `l${li}`;
    note.appendChild(el);
    return el;
  });
  typedShown = '';
  return Math.min(NOTE_MAX, fit(Math.max(...LAYOUT.map(([text]) => text.length))));
}

function message(t) {
  let left = (t - T_MSG) * TYPE_SPEED;
  const counts = LAYOUT.map(([text, li], k) => {
    if (k > 0) left -= (li !== LAYOUT[k - 1][1] ? LINE_PAUSE : BREAK_PAUSE) * TYPE_SPEED;
    const n = Math.max(0, Math.min(text.length, Math.floor(left)));
    left -= text.length;
    return n;
  });
  const key = counts.join(',');
  if (key === typedShown) return;
  typedShown = key;
  LAYOUT.forEach(([line], k) => {
    const text = line.toUpperCase(), n = counts[k];
    const shown = text.slice(0, n).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/&lt;3/g, '<span class="heart">&lt;3</span>');
    const rest = text.slice(n).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    NOTE_LINES[k].innerHTML = `${shown}<span class="rest">${rest}</span>`;
  });
}

// ── i petali che cadono ────────────────────────────────────────────────
// ogni petalo in aria: da quale rosa si è staccato, dove si trova, come gira
const N_FALL = 9, FALL_PERIOD = 6.5;
const FALL = Array.from({ length: N_FALL }, () => Array.from({ length: 8 }, rand));

function falling(t) {
  FALL.forEach(([a, b, c, d, e, f, g, h], k) => {
    const since = t - T_FALL - (k * FALL_PERIOD) / N_FALL;
    if (since < 0) return;
    const age = since % FALL_PERIOD, cycle = Math.floor(since / FALL_PERIOD);
    const R = ROSES[(Math.floor(a * N_ROSES) + cycle * 7) % N_ROSES];
    const fade = smooth(age / 0.4) * smooth((FALL_PERIOD - age) / 1.2);
    const x = R.p[0] + R.A[0] * 0.15 + 0.22 * (c - 0.5) * age + 0.07 * Math.sin(age * (1.6 + 2 * d) + 6 * h);
    const y = R.p[1] + R.A[1] * 0.15 - 0.3 * age - 0.012 * age * age;
    const z = R.p[2] + R.A[2] * 0.15 + 0.16 * age * (0.4 + e);
    const al = age * (1.4 + 2 * f) + 6 * g, be = age * (1.1 + 2 * b);
    const ca = Math.cos(al), sa = Math.sin(al), cb = Math.cos(be), sb = Math.sin(be);
    surface((u, v, o) => {
      const lx = v * 0.045 * Math.sin(Math.PI * (0.15 + 0.85 * u)), ly = (u - 0.5) * 0.075, lz = 0.025 * v * v - 0.012 * u;
      const rx = lx * ca + lz * sa, rz = lz * ca - lx * sa;    // gira attorno all'asse verticale...
      o[0] = x + rx; o[1] = y + ly * cb - rz * sb; o[2] = z + ly * sb + rz * cb;   // ...e cade di taglio
      o[3] = (0.55 + 0.45 * u) * fade;
    }, 7, 5, R.mat);
  });
}

// ── il disegno ─────────────────────────────────────────────────────────
const stage = document.getElementById('stage');
const canvas = document.getElementById('grid');
const ctx = canvas.getContext('2d', { alpha: false });
const glow = document.getElementById('glow');          // l'alone: un pixel per casella, sfocato
const gctx = glow.getContext('2d');
const again = document.getElementById('again');
let W = 0, H = 0, dpr = 1, spW = 1, spH = 1, colX = new Int32Array(0), rowY = new Int32Array(0);
let shine = gctx.createImageData(1, 1), pixels = null, fb = null, glyphPx = null, AW = 0;

function resize() {
  const box = stage.getBoundingClientRect();
  W = box.width; H = box.height;
  dpr = Math.max(1, Math.min(1.5, window.devicePixelRatio || 1, Math.sqrt(1.6e6 / (W * H))));
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.font = `700 20px ${MONO}`;
  const ratio = ctx.measureText('M'.repeat(40)).width / 40 / 20;
  // il mazzo, il biglietto e subito sotto il pulsante per rivederlo: devono starci tutti, senza toccarsi
  const msgSize = layoutNote(W, ratio);
  const noteH = msgSize * NOTE_LINE_H * LAYOUT.length, btnSize = Math.max(14, msgSize * 0.72);
  const below = noteH + btnSize * 1.6 + 48;
  S = Math.max(60, Math.min(W * 0.38, (H * 0.94 - below) / 2.75));
  const top = Math.max(H * 0.03, (H - 2.75 * S - below) * 0.45);
  const size = Math.max(5, S / 40 / ratio);
  cellW = size * ratio; cellH = size * 1.08;
  cols = Math.ceil(W / cellW); rows = Math.ceil(H / cellH);
  OX = W / 2; OY = top + 1.55 * S;
  const spacing = msgSize * ratio * 0.5;
  note.style.fontSize = `${msgSize}px`;
  note.style.letterSpacing = `${spacing}px`;
  note.style.paddingLeft = `${spacing}px`;                 // la spaziatura dopo l'ultima lettera, compensata
  note.style.top = `${OY + 1.17 * S}px`;
  again.style.top = `${OY + 1.17 * S + noteH + 6}px`;
  again.style.fontSize = `${btnSize}px`;
  zbuf = new Float32Array(cols * rows); gbuf = new Uint8Array(cols * rows); cbuf = new Uint8Array(cols * rows);
  colX = Int32Array.from({ length: cols }, (_, c) => Math.round(c * cellW * dpr));
  rowY = Int32Array.from({ length: rows }, (_, r) => Math.round(r * cellH * dpr));
  // ogni lettera in ogni colore, disegnata una volta sola: poi si copiano i pixel
  spW = Math.max(1, Math.floor(cellW * dpr)); spH = Math.max(1, Math.floor(cellH * dpr));
  AW = spW * GLYPHS.length;
  const sheet = document.createElement('canvas');
  sheet.width = AW; sheet.height = spH * PALETTE.length;
  const sctx = sheet.getContext('2d', { willReadFrequently: true });
  sctx.fillStyle = '#000'; sctx.fillRect(0, 0, sheet.width, sheet.height);
  sctx.font = `700 ${size * dpr}px ${MONO}`; sctx.textBaseline = 'top';
  PALETTE.forEach((color, c) => {
    sctx.fillStyle = color;
    for (let g = 0; g < GLYPHS.length; g++) sctx.fillText(GLYPHS[g], g * spW, c * spH);
  });
  glyphPx = new Uint32Array(sctx.getImageData(0, 0, sheet.width, sheet.height).data.buffer);
  pixels = ctx.createImageData(canvas.width, canvas.height);
  fb = new Uint32Array(pixels.data.buffer);
  glow.width = cols; glow.height = rows;
  glow.style.width = `${cols * cellW}px`; glow.style.height = `${rows * cellH}px`;
  shine = gctx.createImageData(cols, rows);
}

function draw() {
  const FW = canvas.width, FH = canvas.height, px = shine.data;
  fb.fill(0xff000000);
  px.fill(0);
  for (let r = 0, i = 0; r < rows; r++) {
    const y0 = rowY[r], h = Math.min(spH, FH - y0);
    for (let c = 0; c < cols; c++, i++) {
      const g = gbuf[i];
      if (g === EMPTY) continue;
      const k = cbuf[i], x0 = colX[c], w = Math.min(spW, FW - x0);
      for (let yy = 0, s = k * spH * AW + g * spW, d = y0 * FW + x0; yy < h; yy++, s += AW, d += FW) {
        for (let xx = 0; xx < w; xx++) fb[d + xx] = glyphPx[s + xx];
      }
      const rgb = PALETTE_RGB[k], o = i * 4;
      px[o] = rgb[0]; px[o + 1] = rgb[1]; px[o + 2] = rgb[2]; px[o + 3] = 255;
    }
  }
  ctx.putImageData(pixels, 0, 0);
  gctx.putImageData(shine, 0, 0);
}

function render(t) {
  const yaw = 0.22 * Math.sin(t * 0.42) - 0.04, pitch = 0.14;
  cY = Math.cos(yaw); sY = Math.sin(yaw); cP = Math.cos(pitch); sP = Math.sin(pitch);
  zbuf.fill(-Infinity); gbuf.fill(EMPTY);
  stems(t); foliage(t); paper(t); ribbon(t); petals(t); sepals(t); pop(t); falling(t); stars(t);
  draw();
  message(t);
  again.classList.toggle('show', t > T_END);
}

// ── via ────────────────────────────────────────────────────────────────
const query = new URLSearchParams(location.search);
const frozen = query.has('t');
let t = frozen ? parseFloat(query.get('t')) || 0 : 0, last = performance.now(), drawn = 0;
again.addEventListener('click', () => { t = 0; });
let resizing = 0;
const onResize = () => { clearTimeout(resizing); resizing = setTimeout(resize, 120); };
window.addEventListener('resize', onResize);
if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
resize();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!frozen) t += dt;
  if (now - drawn < 1000 / 30 - 4) return;
  drawn = now;
  render(t);
}
render(t);
requestAnimationFrame(frame);
</script>
</body>
</html>
